<section class="content" aria-label="Hudson Square video series"><div class="video-series">
  <figure class="video-item"><div class="video-panel"><div class="video-heading"><span class="video-number">01</span><h2 class="video-title">Hudson Square Today</h2></div><div class="video-frame edge-crop"><video controls autoplay muted loop preload="auto" playsinline><source src="../videos/dteq-03-01-hudson-square-today.mp4" type="video/mp4">Your browser does not support HTML video.</video></div></div><figcaption class="video-copy"><p>Mapping Hudson Square’s current land-use patterns to understand the spatial structure of the district today. The analysis reveals how residential, commercial, institutional, and industrial uses coexist within a rapidly changing urban fabric.</p></figcaption></figure>
  <figure class="video-item is-right"><div class="video-panel"><div class="video-heading"><span class="video-number">02</span><h2 class="video-title">How Hudson Square Changed?</h2></div><video controls autoplay muted loop preload="auto" playsinline><source src="../videos/dteq-03-02-how-did-hudson-square-change.mp4" type="video/mp4">Your browser does not support HTML video.</video></div><figcaption class="video-copy"><p>Tracing the district’s historical transformation chronologically to understand how Hudson Square developed into its present form. The sequence follows its evolution from a waterfront industrial district to a printing center and, more recently, a mixed-use neighborhood shaped by redevelopment.</p></figcaption></figure>
  <figure class="video-item"><div class="video-panel"><div class="video-heading"><span class="video-number">03</span><h2 class="video-title">Experiencing Hudson Square</h2></div><video controls autoplay muted loop preload="auto" playsinline><source src="../videos/dteq-03-03-experiencing-hudson-square.mp4" type="video/mp4">Your browser does not support HTML video.</video></div><figcaption class="video-copy"><p>Experiencing Hudson Square at street level through three distinctive conditions that characterize the neighborhood today. The video documents these conditions through direct observation, connecting the district’s physical environment with everyday movement and experience.</p></figcaption></figure>
